name: Bug report
description: Something is broken or behaves unexpectedly
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Please do **not** include a current or upcoming answer word in this issue.
        If the bug has security implications, follow [SECURITY.md](../blob/main/SECURITY.md) instead.

  - type: dropdown
    id: area
    attributes:
      label: Which part?
      options:
        - Web (frontend)
        - API (backend)
        - Both / not sure
    validations:
      required: true

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Go to ...
        2. Guess ...
        3. See ...
    validations:
      required: true

  - type: input
    id: environment
    attributes:
      label: Environment
      placeholder: "Firefox 134 on Android 14 / self-hosted via docker compose"

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or console output
      render: shell
