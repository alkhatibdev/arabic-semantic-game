services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: arabic_semantic_game
    ports:
      # Override if you already run Postgres locally: POSTGRES_PORT=55432 docker compose up
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    build: ./api
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@postgres:5432/arabic_semantic_game
      RATE_LIMIT_STORAGE_URI: redis://redis:6379
      CORS_ORIGINS: '["http://localhost:3000"]'
      ENVIRONMENT: development
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Persist the downloaded embedding model across restarts (~500MB).
      - hf_cache:/home/app/.cache/huggingface
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000"

  web:
    build:
      context: ./web
      args:
        # NEXT_PUBLIC_* values are baked in at build time. This is the URL the
        # browser calls, so it is localhost, not the compose service name.
        NEXT_PUBLIC_API_URL: http://localhost:8000
        NEXT_PUBLIC_SITE_URL: http://localhost:3000
    ports:
      - "${WEB_PORT:-3000}:3000"
    depends_on:
      - api

volumes:
  postgres_data:
  hf_cache:
