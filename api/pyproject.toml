[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["alembic/versions", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "C4"]
ignore = [
    "B008",  # FastAPI's Depends() in defaults is the documented pattern
    "E501",  # line length is handled by the formatter
]

[tool.ruff.lint.per-file-ignores]
"app/db/base.py" = ["F401"]  # models imported solely so Alembic can see them

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
filterwarnings = ["ignore::DeprecationWarning"]
